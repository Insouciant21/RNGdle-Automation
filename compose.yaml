services:
  rngdle:
    build: .
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - rngdle-data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  once:
    build: .
    profiles: [tools]
    command: ["node", "src/index.js", "once"]
    env_file: [.env]
    volumes:
      - rngdle-data:/app/data
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  rngdle-data:
